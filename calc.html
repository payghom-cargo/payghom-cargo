<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ҳисобкунаки Карко</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .calc-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }
        .title { font-size: 18px; font-weight: 700; color: #d32f2f; margin-bottom: 16px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 6px; }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafbfc;
        }
        select:focus, input:focus { border-color: #d32f2f; background-color: #fff; }
        .calc-btn {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .calc-btn:active { background-color: #b71c1c; }
        .result-box {
            margin-top: 16px;
            background: #fff5f5;
            border: 1px solid #ffd8d8;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            display: none;
        }
        .result-title { font-size: 12px; color: #666; margin-bottom: 4px; }
        .result-value { font-size: 20px; font-weight: 700; color: #d32f2f; }
    </style>
</head>
<body>

    <div class="calc-card">
        <div class="title">🧮 Ҳисобкунаки арзиши интиқол</div>
        
        <div class="form-group">
            <label for="shippingType">Намуди интиқол:</label>
            <select id="shippingType">
                <option value="1.5">🚚 Авто (масалан: $1.5 бо 1кг)</option>
                <option value="3.5">✈️ Авиа (масалан: $3.5 бо 1кг)</option>
                <option value="5.0">👑 Авиа VIP (масалан: $5.0 бо 1кг)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="weight">Вазн (кг):</label>
            <input type="number" id="weight" placeholder="Масалан: 5" step="0.1" min="0">
        </div>

        <button type="button" class="calc-btn" onclick="calculatePrice()">Ҳисоб кардан</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">Арзиши тахминии интиқол:</div>
            <div class="result-value" id="resultValue">$0.00</div>
        </div>
    </div>

    <script>
        function calculatePrice() {
            let rate = parseFloat(document.getElementById('shippingType').value);
            let weight = parseFloat(document.getElementById('weight').value);

            if(isNaN(weight) || weight <= 0) {
                alert("Лутфан вазни дурустро ворид кунед!");
                return;
            }

            let total = rate * weight;
            document.getElementById('resultValue').innerText = "$" + total.toFixed(2);
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
