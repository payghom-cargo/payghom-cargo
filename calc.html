<!-- Саҳифаи Ҳисобкунак -->
<div id="pageCalculator" class="app-page hidden">
    <div style="display: flex; align-items: center; margin-bottom: 14px; cursor: pointer;" onclick="switchPage('profile', document.querySelector('.nav-item[data-page=\'profile\']'))">
        <span style="font-size: 18px; margin-right: 8px;">←</span>
        <span style="font-size: 16px; font-weight: 700;">Ҳисобкунаки арзиш</span>
    </div>

    <div class="orders-box" style="background: #fff; padding: 16px;">
        <div class="form-group">
            <label for="calcShippingType">Намуди интиқол:</label>
            <select id="calcShippingType" style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 10px; margin-top: 4px;">
                <option value="1.5">🚚 Авто ($1.5 бо 1кг)</option>
                <option value="3.5">✈️ Авиа ($3.5 бо 1кг)</option>
                <option value="5.0">👑 Авиа VIP ($5.0 бо 1кг)</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: 12px;">
            <label for="calcWeight">Вазн (кг):</label>
            <input type="number" id="calcWeight" placeholder="Масалан: 5" step="0.1" min="0" style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 10px; margin-top: 4px; box-sizing: border-box;">
        </div>

        <button type="button" class="btn" onclick="calculateAppPrice()" style="margin-top: 14px;">Ҳисоб кардан</button>

        <div class="result-box" id="appResultBox" style="margin-top: 14px; background: #fff5f5; border: 1px solid #ffd8d8; border-radius: 12px; padding: 12px; text-align: center; display: none;">
            <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Арзиши тахминии интиқол:</div>
            <div style="font-size: 18px; font-weight: 700; color: #d32f2f;" id="appResultValue">$0.00</div>
        </div>
    </div>
</div>
