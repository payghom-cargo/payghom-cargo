<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payghom Cargo - Системаи пайгирӣ ва ҳисобдорӣ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Қисмҳои барнома */
        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        /* Информатсияи корбар ва баромад */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .user-bar .logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
        }

        /* Нотификатсия ва Натиҷа */
        .result-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
            font-weight: bold;
            font-size: 16px;
            color: #0f172a;
        }

        .rate-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ҚАДАМИ 1: Регистратсия (Ном, Насаб, Телефон) -->
    <div id="step-register" class="step active">
        <div class="header">
            <h2>Регистратсия</h2>
            <p>Барои истифодаи хизматрасонӣ маълумотро ворид кунед</p>
        </div>
        <div class="form-group">
            <label for="fullName">Ном ва Насаб</label>
            <input type="text" id="fullName" placeholder="Масалан: Раҳматулло Саидов">
        </div>
        <div class="form-group">
            <label for="phoneNumber">Рақами телефон</label>
            <input type="tel" id="phoneNumber" placeholder="+992 900 00 00 00">
        </div>
        <button class="btn" onclick="sendSMSCode()">Гирифтани коди SMS</button>
    </div>

    <!-- ҚАДАМИ 2: Тасдиқи коди SMS -->
    <div id="step-sms" class="step">
        <div class="header">
            <h2>Тасдиқи SMS</h2>
            <p id="smsSentText">Коди тасдиқ ба телефони шумо фиристода шуд</p>
        </div>
        <div class="form-group">
            <label for="smsCode">Коди SMS (4 рақам)</label>
            <input type="text" id="smsCode" maxlength="4" placeholder="1234" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
        </div>
        <button class="btn" onclick="verifySMSCode()">Ворид шудан</button>
        <button class="btn btn-secondary" onclick="backToRegister()">Озод кардани телефон</button>
    </div>

    <!-- ҚАДАМИ 3: Барномаи асосӣ (Трек-код ва Ҳисобкунак) -->
    <div id="step-app" class="step">
        <div class="user-bar">
            <span>👤 <strong id="userDisplayName"></strong></span>
            <span class="logout-btn" onclick="logout()">Баромад</span>
        </div>

        <div class="header" style="text-align: left; margin-bottom: 16px;">
            <h2>Иловаи Трек-код ва Ҳисобкунӣ</h2>
            <p>Маълумоти бори худро тафтиш кунед</p>
        </div>

        <div class="form-group">
            <label for="trackCode">Трек-коди Чин</label>
            <input type="text" id="trackCode" placeholder="Масалан: YT123456789CN">
        </div>

        <div class="form-group">
            <label for="weight">Вазни бор (кг)</label>
            <input type="number" id="weight" step="0.1" placeholder="Масалан: 2.5" oninput="calculatePrice()">
        </div>

        <div class="form-group">
            <label for="category">Намуди бор / Тариф</label>
            <select id="category" onchange="calculatePrice()">
                <option value="standard">Бори оддӣ ($3.5 / кг)</option>
                <option value="express">Бори тезсохт / Экспресс ($4.5 / кг)</option>
                <option value="heavy">Бори вазнин (аз 10кг боло - $3.0 / кг)</option>
            </select>
        </div>

        <button class="btn" onclick="saveParcel()">Ҳамроҳ кардани бор</button>

        <!-- Натиҷаи ҳисобкунӣ -->
        <div id="resultCard" class="result-card" style="display: none;">
            <div class="result-item">
                <span>Трек-код:</span>
                <span id="resTrack">-</span>
            </div>
            <div class="result-item">
                <span>Вазн:</span>
                <span id="resWeight">0 кг</span>
            </div>
            <div class="result-item">
                <span>Тариф:</span>
                <span id="resRate">$0 / кг</span>
            </div>
            <div class="result-item">
                <span>Суммаи умумӣ:</span>
                <span id="resTotal">$0.00</span>
            </div>
        </div>
    </div>

</div>

<script>
    // Маълумоти муваққати барои танзими SMS
    let tempUser = {
        fullName: '',
        phone: '',
        generatedCode: ''
    };

    // Дар аввал тафтиш мекунем, ки корбар аллакай ворид шудааст ё не
    window.onload = function() {
        const savedUser = JSON.parse(localStorage.getItem('payghom_user'));
        if (savedUser && savedUser.isLoggedIn) {
            showAppView(savedUser.fullName);
        }
    };

    // 1. Фиристодани SMS
    function sendSMSCode() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phoneNumber').value.trim();

        if (!fullName || phone.length < 8) {
            alert('Лутфан ном, насаб ва рақами телефонро дуруст ворид кунед!');
            return;
        }

        // Сохтани коди тасодуфии 4-рақама
        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        tempUser.fullName = fullName;
        tempUser.phone = phone;
        tempUser.generatedCode = randomCode;

        // Эзоҳ: Дар ин ҷо кодро ба сервери Backend мефиристодем (масалан OsonSMS API).
        // Барои санҷиш ва намоиш кодро дар экран нишон медиҳем:
        alert(`[SMS-Симулятсия]\nКоди тасдиқи шумо: ${randomCode}`);

        document.getElementById('smsSentText').innerText = `Код ба рақами ${phone} фиристода шуд.`;
        switchStep('step-sms');
    }

    // 2. Санҷиши коди SMS ва воридшавӣ
    function verifySMSCode() {
        const enteredCode = document.getElementById('smsCode').value.trim();

        if (enteredCode === tempUser.generatedCode) {
            const userData = {
                fullName: tempUser.fullName,
                phone: tempUser.phone,
                isLoggedIn: true
            };
            localStorage.setItem('payghom_user', JSON.stringify(userData));
            showAppView(userData.fullName);
        } else {
            alert('Коди SMS нодуруст аст! Лутфан бори дигар санҷед.');
        }
    }

    function backToRegister() {
        switchStep('step-register');
    }

    function showAppView(name) {
        document.getElementById('userDisplayName').innerText = name;
        switchStep('step-app');
    }

    function logout() {
        localStorage.removeItem('payghom_user');
        document.getElementById('fullName').value = '';
        document.getElementById('phoneNumber').value = '';
        document.getElementById('smsCode').value = '';
        switchStep('step-register');
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    // 3. Ҳисоб кардани нархи бор
    function calculatePrice() {
        const weightInput = parseFloat(document.getElementById('weight').value) || 0;
        const category = document.getElementById('category').value;
        const trackCode = document.getElementById('trackCode').value.trim();

        if (weightInput <= 0) {
            document.getElementById('resultCard').style.display = 'none';
            return;
        }

        let rate = 3.5; // Нархи стандартӣ

        if (category === 'express') {
            rate = 4.5;
        } else if (category === 'heavy') {
            rate = 3.0;
        } else if (weightInput >= 10) {
            rate = 3.0; // Тахфиф барои бори аз 10кг боло
        }

        const totalPrice = (weightInput * rate).toFixed(2);

        // Намоиши натиҷа
        document.getElementById('resTrack').innerText = trackCode || 'Ворид нашудааст';
        document.getElementById('resWeight').innerText = weightInput + ' кг';
        document.getElementById('resRate').innerText = '$' + rate + ' / кг';
        document.getElementById('resTotal').innerText = '$' + totalPrice;

        document.getElementById('resultCard').style.display = 'block';
    }

    // 4. Сабт кардани бор
    function saveParcel() {
        const trackCode = document.getElementById('trackCode').value.trim();
        const weight = document.getElementById('weight').value;

        if (!trackCode || !weight) {
            alert('Лутфан трек-код ва вазни борро ворид кунед!');
            return;
        }

        alert(`Бори шумо бо трек-коди ${trackCode} муваффақона ҳамроҳ карда шуд!`);
        
        // Пок кардани майдонҳо
        document.getElementById('trackCode').value = '';
        document.getElementById('weight').value = '';
        document.getElementById('resultCard').style.display = 'none';
    }
</script>

</body>
</html>
