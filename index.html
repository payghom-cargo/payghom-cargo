<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paighom Cargo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #d32f2f;
            margin: 0 0 8px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
            margin: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafbfc;
        }
        input:focus {
            border-color: #d32f2f;
            background-color: #fff;
        }
        .btn {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:active {
            background-color: #b71c1c;
        }
        .hidden {
            display: none;
        }
        .success-screen {
            text-align: center;
            padding: 20px 0;
        }
        .success-icon {
            font-size: 48px;
            color: #4CAF50;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Қадами 1: Ворид кардани ном ва рақам -->
        <div id="step1">
            <div class="header">
                <div class="icon">📦</div>
                <h1 class="title">Paighom Cargo</h1>
                <p class="subtitle">Барои гирифтани суроғаи шахсии худ маълумотро ворид кунед</p>
            </div>
            
            <div class="form-group">
                <label for="fullname">Ному насаб:</label>
                <input type="text" id="fullname" placeholder="Ному насабро ворид кунед" value="">
            </div>
            
            <div class="form-group">
                <label for="phone">Рақами телефон:</label>
                <input type="tel" id="phone" placeholder="+992..." value="">
            </div>
            
            <button type="button" id="sendCodeBtn" class="btn">Фиристодани коди тасдиқ</button>
        </div>

        <!-- Қадами 2: Ворид кардани коди тасодуфӣ -->
        <div id="step2" class="hidden">
            <div class="header">
                <div class="icon">🔒</div>
                <h1 class="title">Тасдиқи рақам</h1>
                <p class="subtitle" id="codeSentText">Коди тасдиқ ба рақами шумо фиристода шуд</p>
            </div>
            
            <div class="form-group">
                <label for="code">Коди 4-рақамаро ворид кунед:</label>
                <input type="text" id="code" placeholder="Масалан: 1234" maxlength="4" style="text-align: center; font-size: 18px; letter-spacing: 4px;">
            </div>
            
            <button type="button" id="verifyCodeBtn" class="btn">Тасдиқ кардан</button>
        </div>

        <!-- Қадами 3: Дохили барнома шудан (Кабинети асосӣ) -->
        <div id="step3" class="hidden">
            <div class="success-screen">
                <div class="success-icon">✅</div>
                <h1 class="title">Хуш омадед!</h1>
                <p class="subtitle" id="welcomeUser" style="margin-bottom: 20px;"></p>
                <div style="background: #fafbfc; padding: 15px; border-radius: 10px; border: 1px solid #e0e0e0; margin-bottom: 15px; text-align: left;">
                    <strong>Суроғаи шумо дар Чин:</strong><br>
                    <span style="font-size: 13px; color: #555;">广州市荔湾区... SV003-X2574</span>
                </div>
                <button type="button" id="enterAppBtn" class="btn">Гузариш ба фармоишҳо</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let generatedCode = "";
        let userName = "";
        let userPhone = "";

        // Тугмаи фиристодани код
        document.getElementById('sendCodeBtn').onclick = function() {
            userName = document.getElementById('fullname').value.trim();
            userPhone = document.getElementById('phone').value.trim();

            if(userName === "" || userPhone === "") {
                alert("Лутфан ному насаб ва рақами телефонро пур кунед!");
                return;
            }

            // Тасодуфан сохтани коди 4 рақама (барои санҷиш)
            generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            // Дар ҳолати воқеӣ ин код ба SMS ё бот меравад. Барои осонӣ дар огоҳинома нишон медиҳем:
            alert("Коди тасдиқи шумо (барои санҷиш): " + generatedCode);

            // Гузариш ба экрани дуюм (Қадами 2)
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        };

        // Тугмаи санҷиши код
        document.getElementById('verifyCodeBtn').onclick = function() {
            let enteredCode = document.getElementById('code').value.trim();

            if(enteredCode === "") {
                alert("Лутфан коди тасдиқро ворид кунед!");
                return;
            }

            if(enteredCode === generatedCode) {
                // Код дуруст аст -> Гузариш ба экрани асосӣ (Қадами 3)
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                document.getElementById('welcomeUser').innerText = userName + " (" + userPhone + ")";
            } else {
                alert("Коди воридкардашуда хато аст! Лутфан аз нав санҷед.");
            }
        };

        // Тугмаи дохил шудан ба барнома
        document.getElementById('enterAppBtn').onclick = function() {
            alert("Шумо бомуваффақият ворид шудед!");
            // Агар хоҳед, ки веб-апп пӯшида шавад ё ба бот маълумот равад:
            // tg.sendData(JSON.stringify({name: userName, phone: userPhone}));
            // tg.close();
        };
    </script>
</body>
</html>
