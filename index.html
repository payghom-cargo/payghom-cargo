<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paighom Cargo</title>
    <!-- Китобхонаи расмии Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #d32f2f;
            margin: 0 0 8px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
            margin: 0;
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafbfc;
            transition: border-color 0.2s, background-color 0.2s;
        }
        input:focus {
            border-color: #d32f2f;
            background-color: #fff;
        }
        .btn {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="icon">📦</div>
            <h1 class="title">Paighom Cargo</h1>
            <p class="subtitle">Барои гирифтани суроғаи шахсии худ маълумотро ворид кунед</p>
        </div>
        
        <!-- Ба ҷои <form> мо инҷо аз <div> истифода мебарем, то саҳифа аз нав бор нашавад -->
        <div id="cargoForm">
            <div class="form-group">
                <label for="fullname">Ному насаб:</label>
                <input type="text" id="fullname" name="fullname" value="Roma" placeholder="Ному насабро ворид кунед">
            </div>
            
            <div class="form-group">
                <label for="phone">Рақами телефон:</label>
                <input type="tel" id="phone" name="phone" value="+992555143131" placeholder="+992...">
            </div>
            
            <button type="button" id="submitBtn" class="btn">Фиристодани коди тасдиқ</button>
        </div>
    </div>

    <script>
        // Фаъолсозии муҳити Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Пайваст кардани амалиёт ба тугма тавассути ID
        document.getElementById('submitBtn').addEventListener('click', function() {
            const fullname = document.getElementById('fullname').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // Санҷиш, ки майдонҳо холӣ набошанд
            if (!fullname || !phone) {
                alert('Лутфан ҳамаи майдонҳоро пур кунед!');
                return;
            }

            // Маълумот барои фиристодан
            const formData = {
                fullname: fullname,
                phone: phone
            };

            console.log('Маълумот фиристода шуд:', formData);

            // Шумо метавонед инҷо маълумотро ба боти Telegram баргардонед:
            // tg.sendData(JSON.stringify(formData));

            // Барои санҷиш паём мебарорад
            alert('Коди тасдиқ бомуваффақият фиристода шуд!');
            
            // Агар хоҳед, ки баъди пахш кардан оина пӯшида шавад:
            // tg.close();
        });
    </script>
</body>
</html>
