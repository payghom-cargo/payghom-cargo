<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payghom Cargo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff5f5;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        h2 { color: #d32f2f; margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { font-size: 12px; color: #444; font-weight: bold; display: block; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            background: #fafafa;
        }
        input:focus { border-color: #d32f2f; background: #fff; }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:active { background-color: #b71c1c; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Қадами 1 -->
        <div id="step-register">
            <h2>Пайғом Карго</h2>
            <p>Маълумоти худро барои ворид шудан ворид кунед</p>
            
            <div class="input-group">
                <label>Ному насаб:</label>
                <input type="text" id="name-input" placeholder="Ғоибов Раҳматулло">
            </div>
            
            <div class="input-group">
                <label>Рақами телефон:</label>
                <input type="tel" id="phone-input" placeholder="+992 000 00 00 00">
            </div>

            <button class="btn" type="button" id="send-btn">Фиристодани коди тасдиқ</button>
        </div>

        <!-- Қадами 2 -->
        <div id="step-code" class="hidden">
            <h2>Тасдиқи рақам</h2>
            <p>Коди фиристодашударо ворид кунед</p>
            
            <div class="input-group">
                <label>Коди 4-рақама:</label>
                <input type="text" id="code-input" placeholder="1234" maxlength="4">
            </div>

            <button class="btn" type="button" id="verify-btn">Ворид шудан</button>
        </div>
    </div>

    <script>
        // Фаъолсозии Телеграм WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Пайваст кардани тугмаҳо тавассути JavaScript (барои пешгирии хатогӣ дар телефонҳо)
        document.getElementById('send-btn').addEventListener('click', function() {
            let nameInput = document.getElementById('name-input').value.trim();
            let phoneInput = document.getElementById('phone-input').value.trim();

            if (nameInput === "") {
                alert("Лутфан ному насабатонро нависед!");
                return;
            }

            if (phoneInput.length < 7) {
                alert("Лутфан рақами телефонатонро дуруст ворид кунед!");
                return;
            }

            alert("Коди тасдиқ фиристода шуд! (Тест: 1234)");

            // Гузариш ба экрани дуюм
            document.getElementById('step-register').classList.add('hidden');
            document.getElementById('step-code').classList.remove('hidden');
        });

        document.getElementById('verify-btn').addEventListener('click', function() {
            let codeInput = document.getElementById('code-input').value.trim();

            if (codeInput === "1234") {
                alert("Ташаккур, ворид шудан бомуваффақият гузашт!");
                // Инҷо метавонед ба саҳифаи асосии борҳо гузаред
            } else {
                alert("Код нодуруст аст! Лутфан 1234-ро санҷед.");
            }
        });
    </script>
</body>
</html>
