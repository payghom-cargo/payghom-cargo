<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paighom cargo bot</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: 10px;
        }

        .header {
            text-align: left;
            margin-bottom: 14px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            color: #64748b;
            font-size: 13px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .btn:active {
            background-color: #1d4ed8;
            transform: scale(0.98);
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .user-bar .badge-out {
            color: #ef4444;
            background: #fee2e2;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .parcels-title {
            font-weight: 700;
            margin: 20px 0 12px 0;
            font-size: 15px;
            color: #1e293b;
        }

        .parcel-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
        }

        .parcel-info {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }

        .parcel-info strong {
            color: #0f172a;
        }

        .parcel-price {
            font-size: 15px;
            font-weight: 700;
            color: #2563eb;
            margin-top: 6px;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Барнома бевосита аз ҳамин қисм (Иловаи трек-код) сар мешавад -->
    <div id="step-app">
        <div class="user-bar">
            <span>👤 <strong>Раҳматулло</strong></span>
            <span class="badge-out" onclick="clearAllData()">Тоза кардан</span>
        </div>

        <div class="header">
            <h2>Иловаи Трек-код</h2>
            <p>Трек-код ва вазни борро дохил кунед</p>
        </div>

        <form onsubmit="handleSaveParcel(event)">
            <div class="form-group">
                <label for="trackCode">Трек-коди Чин</label>
                <input type="text" id="trackCode" required placeholder="Масалан: YT783456789CN">
            </div>

            <div class="form-group">
                <label for="weight">Вазни бор (кг)</label>
                <input type="number" id="weight" step="0.1" required placeholder="2.5">
            </div>

            <div class="form-group">
                <label for="category">Намуди бор / Тариф</label>
                <select id="category">
                    <option value="kamaz">Бори оддӣ - Камаз ($2.8 / кг)</option>
                    <option value="avia">Бори тезсохт - Авиа ($9.2 / кг)</option>
                </select>
            </div>

            <button class="btn" type="submit">Ҳамроҳ ва сабт кардан</button>
        </form>

        <div class="parcels-title">📦 Борҳои сабтшуда</div>
        <div id="parcelsList"></div>
    </div>

</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    window.onload = function() {
        renderParcels();
    };

    function handleSaveParcel(e) {
        e.preventDefault();
        const trackCode = document.getElementById('trackCode').value.trim();
        const weightInput = parseFloat(document.getElementById('weight').value);
        const category = document.getElementById('category').value;

        if (!trackCode || isNaN(weightInput) || weightInput <= 0) {
            showAlert('Лутфан трек-код ва вазни дурустро ворид кунед!');
            return;
        }

        let rate = 2.8;
        let categoryName = "Камаз ($2.8 / кг)";
        if (category === 'avia') {
            rate = 9.2;
            categoryName = "Авиа ($9.2 / кг)";
        }

        const totalPrice = (weightInput * rate).toFixed(2);

        const newParcel = {
            id: Date.now(),
            trackCode: trackCode,
            weight: weightInput,
            rate: rate,
            categoryName: categoryName,
            totalPrice: totalPrice
        };

        let parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];
        parcels.push(newParcel);
        localStorage.setItem('paighom_parcels', JSON.stringify(parcels));

        if (tg && tg.sendData) {
            const dataToSend = {
                user: "Раҳматулло",
                trackCode: trackCode,
                weight: weightInput,
                type: categoryName,
                totalPrice: totalPrice
            };
            tg.sendData(JSON.stringify(dataToSend));
        }

        document.getElementById('trackCode').value = '';
        document.getElementById('weight').value = '';

        showAlert('Бори шумо бо муваффақият сабт шуд!');
        renderParcels();
    }

    function renderParcels() {
        const parcelsList = document.getElementById('parcelsList');
        const parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];

        if (parcels.length === 0) {
            parcelsList.innerHTML = `<div class="empty-state">Ҳоло ҳеҷ боре сабт нашудааст.</div>`;
            return;
        }

        let html = '';
        parcels.forEach(p => {
            html += `
                <div class="parcel-item">
                    <button class="delete-btn" onclick="deleteParcel(${p.id})">Тоза</button>
                    <div class="parcel-info">Трек: <strong>${p.trackCode}</strong></div>
                    <div class="parcel-info">Тариф: <strong>${p.categoryName}</strong></div>
                    <div class="parcel-info">Вазн: <strong>${p.weight} кг</strong></div>
                    <div class="parcel-price">Сумма: $${p.totalPrice}</div>
                </div>
            `;
        });

        parcelsList.innerHTML = html;
    }

    function deleteParcel(id) {
        let parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];
        parcels = parcels.filter(p => p.id !== id);
        localStorage.setItem('paighom_parcels', JSON.stringify(parcels));
        renderParcels();
    }

    function clearAllData() {
        if (confirm("Ҳама борҳои сабтшуда тоза карда шаванд?")) {
            localStorage.removeItem('paighom_parcels');
            renderParcels();
        }
    }

    function showAlert(msg) {
        if (tg && tg.showAlert) {
            tg.showAlert(msg);
        } else {
            alert(msg);
        }
    }
</script>

</body>
</html>
