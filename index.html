<!DOCTYPE html>
<html lang="tj">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payghom Cargo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e88e5;
      --primary-dark: #1565c0;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1f2937;
      --subtext: #6b7280;
      --border: #e5e7eb;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 80px;
    }

    /* Асосӣ */
    .app-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
    }

    .app-header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .app-header p {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* Картҳо */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }

    .card-header i {
      color: var(--primary);
    }

    /* Ҷустуҷӯи Трек */
    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Суроғаи Склад */
    .address-details {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 10px;
      color: #334155;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Навигатсия дар поён */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--subtext);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-btn i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>Payghom Cargo</h1>
    <p>Бохтар / Интиқоли тиҷоратӣ ва шахсӣ аз Чин</p>
  </div>

  <!-- Ҷустуҷӯ -->
  <div class="card">
    <div class="card-header">
      <i class="fa-solid fa-magnifying-glass"></i> Пайгирии посылка (Трек-код)
    </div>
    <div class="search-box">
      <input type="text" id="trackInput" placeholder="Ракми трекро дохил кунед...">
      <button onclick="searchTrack()">Ҷустуҷӯ</button>
    </div>
  </div>

  <!-- Суроғаи Склад -->
  <div class="card">
    <div class="card-header">
      <i class="fa-solid fa-warehouse"></i> Суроғаи склади Чин
    </div>
    <div class="address-details" id="warehouseAddr">
      <b>收货人:</b> Payghom Cargo<br>
      <b>手机号码:</b> 13800138000<br>
      <b>广东省:</b> 广州市荔湾区<br>
      <b>详细地址:</b> 广东省广州市荔湾区仓库123号
    </div>
    <button class="btn-action" onclick="copyAddr()">
      <i class="fa-regular fa-copy"></i> Нусхабардории суроға
    </button>
  </div>

  <!-- Навигатсия -->
  <div class="bottom-nav">
    <div class="nav-btn active">
      <i class="fa-solid fa-house"></i>
      <span>Асосӣ</span>
    </div>
    <div class="nav-btn">
      <i class="fa-solid fa-boxes-packing"></i>
      <span>Борҳо</span>
    </div>
    <div class="nav-btn">
      <i class="fa-solid fa-calculator"></i>
      <span>Ҳисобкунак</span>
    </div>
    <div class="nav-btn">
      <i class="fa-solid fa-user"></i>
      <span>Профил</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
    }

    function copyAddr() {
      const text = document.getElementById('warehouseAddr').innerText;
      navigator.clipboard.writeText(text).then(() => {
        if (tg && tg.showAlert) {
          tg.showAlert("Суроға нусхабардорӣ шуд!");
        } else {
          alert("Суроға нусхабардорӣ шуд!");
        }
      });
    }

    function searchTrack() {
      const code = document.getElementById('trackInput').value;
      if (!code) {
        alert("Лутфан, рақами трек-кодро ворид кунед.");
        return;
      }
      alert("Ҷустуҷӯи рақами: " + code);
    }
  </script>
</body>
</html>
