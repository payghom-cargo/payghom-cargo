<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paighom Cargo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f5f7;
            color: #333;
        }
        /* Шапка */
        .header {
            background-color: #d32f2f;
            color: white;
            padding: 15px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-name {
            font-size: 18px;
            font-weight: bold;
        }
        .user-id-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 5px;
        }

        /* Контейнер */
        .container {
            padding: 15px;
            padding-bottom: 70px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card-title {
            color: #d32f2f;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-row {
            background: #f9f9f9;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #777;
        }
        .info-value {
            font-size: 15px;
            font-weight: bold;
            color: #222;
            margin-top: 2px;
        }

        /* Тугмаи Настройка дар дохили профил */
        .settings-item-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff5f5;
            border: 1px solid #ffd6d6;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #d32f2f;
        }

        /* Менюи поёнӣ */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }
        .nav-item {
            text-align: center;
            text-decoration: none;
            color: #777;
            font-size: 11px;
        }
        .nav-item.active {
            color: #d32f2f;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* Окнаи Танзимот (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 350px;
            padding: 20px;
            border-radius: 15px;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .setting-group {
            margin-bottom: 12px;
        }
        .setting-group label {
            font-size: 13px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }
        .setting-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .support-link {
            color: #d32f2f;
            text-decoration: none;
            font-weight: bold;
        }
        .close-modal-btn {
            background: #d32f2f;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="header-top">
            <span class="user-name">Раҳматулло</span>
            <span>🔔</span>
        </div>
        <div class="user-id-badge">ID: SV003-X2574</div>
    </div>

    <div class="container">
        <!-- Профили корбар -->
        <div class="card">
            <div class="card-title">👤 Профили корбар</div>
            
            <div class="info-row">
                <div class="info-label">Ному насаб:</div>
                <div class="info-value">Раҳматулло</div>
            </div>

            <div class="info-row">
                <div class="info-label">ID-и шахсии шумо:</div>
                <div class="info-value" style="color: #d32f2f;">SV003-X2574</div>
            </div>

            <!-- Тугмаи Танзимот инҷо илова шуд -->
            <div class="settings-item-btn" onclick="openModal()">
                <span>⚙️ Танзимот (Настройки)</span>
                <span>➔</span>
            </div>
        </div>
    </div>

    <!-- Modal-и Танзимот -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>Танзимоти барнома</h3>
            
            <div class="setting-group">
                <label>Забон (Язык):</label>
                <select id="langSelect">
                    <option value="tj">Тоҷикӣ</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Дастгирӣ (Поддержка):</label>
                <p style="margin-top: 4px;"><a href="https://t.me/Rom_4ik2002" target="_blank" class="support-link">@Rom_4ik2002</a></p>
            </div>

            <button class="close-modal-btn" onclick="closeModal()">Пӯшидан</button>
        </div>
    </div>

    <!-- Менюи поёнӣ -->
    <div class="nav-bar">
        <a href="#" class="nav-item">
            <div>🏠</div> Главная
        </a>
        <a href="#" class="nav-item">
            <div>📦</div> Заказы
        </a>
        <a href="#" class="nav-item">
            <div>🧮</div> Калькулятор
        </a>
        <a href="#" class="nav-item active">
            <div>👤</div> Профиль
        </a>
    </div>

    <script>
        function openModal() {
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }
    </script>
</body>
</html>
