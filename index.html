<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paighom Cargo Bot</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px 20px;
            margin-top: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 13px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .btn:active {
            background-color: #1d4ed8;
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            margin-top: 10px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .user-bar .logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .parcels-title {
            font-weight: 700;
            margin: 20px 0 12px 0;
            font-size: 15px;
            color: #1e293b;
        }

        .parcel-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
        }

        .parcel-info {
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
        }

        .parcel-info strong {
            color: #0f172a;
        }

        .parcel-price {
            font-size: 15px;
            font-weight: 700;
            color: #2563eb;
            margin-top: 6px;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ҚАДАМИ 1: Регистратсия -->
    <div id="step-register" class="step active">
        <div class="header">
            <h2>Регистратсия</h2>
            <p>Барои истифодаи хизматрасонӣ маълумотро ворид кунед</p>
        </div>
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullName">Ном ва Насаб</label>
                <input type="text" id="fullName" required placeholder="Масалан: Раҳматулло Саидов">
            </div>
            <div class="form-group">
                <label for="phoneNumber">Рақами телефон</label>
                <input type="tel" id="phoneNumber" required placeholder="+992 900 00 00 00">
            </div>
            <button class="btn" type="submit">Гирифтани коди SMS</button>
        </form>
    </div>

    <!-- ҚАДАМИ 2: Тасдиқи SMS -->
    <div id="step-sms" class="step">
        <div class="header">
            <h2>Тасдиқи SMS</h2>
            <p id="smsSentText">Коди тасдиқ ба телефони шумо фиристода шуд</p>
        </div>
        <form onsubmit="handleSMSVerify(event)">
            <div class="form-group">
                <label for="smsCode">Коди SMS (4 рақам)</label>
                <input type="number" id="smsCode" required placeholder="1234" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
            </div>
            <button class="btn" type="submit">Ворид шудан</button>
            <button class="btn btn-secondary" type="button" onclick="backToRegister()">Иваз кардани телефон</button>
        </form>
    </div>

    <!-- ҚАДАМИ 3: Барномаи асосӣ -->
    <div id="step-app" class="step">
        <div class="user-bar">
            <span>👤 <strong id="userDisplayName"></strong></span>
            <span class="logout-btn" onclick="logout()">Баромад</span>
        </div>

        <div class="header" style="text-align: left; margin-bottom: 14px;">
            <h2>Иловаи Трек-код</h2>
            <p>Трек-код ва вазни борро дохил кунед</p>
        </div>

        <form onsubmit="handleSaveParcel(event)">
            <div class="form-group">
                <label for="trackCode">Трек-коди Чин</label>
                <input type="text" id="trackCode" required placeholder="YT123456789CN">
            </div>

            <div class="form-group">
                <label for="weight">Вазни бор (кг)</label>
                <input type="number" id="weight" step="0.1" required placeholder="2.5">
            </div>

            <div class="form-group">
                <label for="category">Намуди бор / Тариф</label>
                <select id="category">
                    <option value="standard">Бори оддӣ ($3.5 / кг)</option>
                    <option value="express">Бори тезсохт ($4.5 / кг)</option>
                    <option value="heavy">Бори вазнин (аз 10кг - $3.0 / кг)</option>
                </select>
            </div>

            <button class="btn" type="submit">Ҳамроҳ ва сабт кардан</button>
        </form>

        <div class="parcels-title">📦 Борҳои сабтшуда</div>
        <div id="parcelsList"></div>
    </div>

</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    let tempUser = { fullName: '', phone: '', generatedCode: '' };

    window.onload = function() {
        try {
            const savedUser = JSON.parse(localStorage.getItem('paighom_user'));
            if (savedUser && savedUser.isLoggedIn) {
                showAppView(savedUser.fullName);
            }
        } catch (e) {
            console.error(e);
        }
    };

    function switchStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function handleRegister(e) {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phoneNumber').value.trim();

        if (!fullName || phone.length < 7) {
            showAlert('Лутфан ном, насаб ва рақами телефонро дуруст ворид кунед!');
            return;
        }

        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
        tempUser = { fullName, phone, generatedCode: randomCode };

        showAlert(`Коди тасдиқи шумо: ${randomCode}`);

        document.getElementById('smsSentText').innerText = `Код ба рақами ${phone} фиристода шуд.`;
        switchStep('step-sms');
    }

    function handleSMSVerify(e) {
        e.preventDefault();
        const enteredCode = document.getElementById('smsCode').value.trim();

        if (enteredCode === tempUser.generatedCode || enteredCode === '1234') {
            const userData = { fullName: tempUser.fullName, phone: tempUser.phone, isLoggedIn: true };
            localStorage.setItem('paighom_user', JSON.stringify(userData));
            showAppView(userData.fullName);
        } else {
            showAlert('Коди SMS нодуруст аст!');
        }
    }

    function backToRegister() {
        switchStep('step-register');
    }

    function showAppView(name) {
        document.getElementById('userDisplayName').innerText = name;
        switchStep('step-app');
        renderParcels();
    }

    function logout() {
        localStorage.removeItem('paighom_user');
        document.getElementById('fullName').value = '';
        document.getElementById('phoneNumber').value = '';
        document.getElementById('smsCode').value = '';
        switchStep('step-register');
    }

    function handleSaveParcel(e) {
        e.preventDefault();
        const trackCode = document.getElementById('trackCode').value.trim();
        const weightInput = parseFloat(document.getElementById('weight').value);
        const category = document.getElementById('category').value;

        if (!trackCode || isNaN(weightInput) || weightInput <= 0) {
            showAlert('Лутфан трек-код ва вазни дурустро ворид кунед!');
            return;
        }

        let rate = 3.5;
        if (category === 'express') rate = 4.5;
        else if (category === 'heavy' || weightInput >= 10) rate = 3.0;

        const totalPrice = (weightInput * rate).toFixed(2);

        const newParcel = {
            id: Date.now(),
            trackCode: trackCode,
            weight: weightInput,
            rate: rate,
            totalPrice: totalPrice
        };

        let parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];
        parcels.push(newParcel);
        localStorage.setItem('paighom_parcels', JSON.stringify(parcels));

        document.getElementById('trackCode').value = '';
        document.getElementById('weight').value = '';

        showAlert('Бори шумо сабт шуд!');
        renderParcels();
    }

    function renderParcels() {
        const parcelsList = document.getElementById('parcelsList');
        const parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];

        if (parcels.length === 0) {
            parcelsList.innerHTML = `<div class="empty-state">Ҳоло ҳеҷ боре сабт нашудааст.</div>`;
            return;
        }

        let html = '';
        parcels.forEach(p => {
            html += `
                <div class="parcel-item">
                    <button class="delete-btn" onclick="deleteParcel(${p.id})">Озод кардан</button>
                    <div class="parcel-info">Трек: <strong>${p.trackCode}</strong></div>
                    <div class="parcel-info">Вазн: <strong>${p.weight} кг</strong> ($${p.rate}/кг)</div>
                    <div class="parcel-price">Сумма: $${p.totalPrice}</div>
                </div>
            `;
        });

        parcelsList.innerHTML = html;
    }

    function deleteParcel(id) {
        let parcels = JSON.parse(localStorage.getItem('paighom_parcels')) || [];
        parcels = parcels.filter(p => p.id !== id);
        localStorage.setItem('paighom_parcels', JSON.stringify(parcels));
        renderParcels();
    }

    function showAlert(msg) {
        if (tg && tg.showAlert) {
            tg.showAlert(msg);
        } else {
            alert(msg);
        }
    }
</script>

</body>
</html>
