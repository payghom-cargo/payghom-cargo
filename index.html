<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payghom Cargo - Системаи пайгирӣ ва сабти борҳо</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
            margin-top: 8px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .user-bar .logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
        }

        /* Намоиши рӯйхати борҳои сабтшуда */
        .parcels-header {
            font-weight: bold;
            margin: 20px 0 10px 0;
            font-size: 16px;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .parcel-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .parcel-info {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .parcel-info strong {
            color: #0f172a;
        }

        .parcel-price {
            font-size: 15px;
            font-weight: bold;
            color: #2563eb;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 15px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ҚАДАМИ 1: Регистратсия -->
    <div id="step-register" class="step active">
        <div class="header">
            <h2>Регистратсия</h2>
            <p>Барои истифодаи хизматрасонӣ маълумотро ворид кунед</p>
        </div>
        <div class="form-group">
            <label for="fullName">Ном ва Насаб</label>
            <input type="text" id="fullName" placeholder="Раҳматулло Саидов">
        </div>
        <div class="form-group">
            <label for="phoneNumber">Рақами телефон</label>
            <input type="tel" id="phoneNumber" placeholder="+992 900 00 00 00">
        </div>
        <button class="btn" onclick="sendSMSCode()">Гирифтани коди SMS</button>
    </div>

    <!-- ҚАДАМИ 2: Тасдиқи SMS -->
    <div id="step-sms" class="step">
        <div class="header">
            <h2>Тасдиқи SMS</h2>
            <p id="smsSentText">Коди тасдиқ ба телефони шумо фиристода шуд</p>
        </div>
        <div class="form-group">
            <label for="smsCode">Коди SMS (4 рақам)</label>
            <input type="text" id="smsCode" maxlength="4" placeholder="1234" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
        </div>
        <button class="btn" onclick="verifySMSCode()">Ворид шудан</button>
        <button class="btn btn-secondary" onclick="backToRegister()">Озод кардани телефон</button>
    </div>

    <!-- ҚАДАМИ 3: Барномаи асосӣ ва Рӯйхат -->
    <div id="step-app" class="step">
        <div class="user-bar">
            <span>👤 <strong id="userDisplayName"></strong></span>
            <span class="logout-btn" onclick="logout()">Баромад</span>
        </div>

        <div class="header" style="text-align: left; margin-bottom: 16px;">
            <h2>Иловаи Трек-код</h2>
            <p>Трек-код ва вазни борро дохил кунед</p>
        </div>

        <div class="form-group">
            <label for="trackCode">Трек-коди Чин</label>
            <input type="text" id="trackCode" placeholder="YT123456789CN">
        </div>

        <div class="form-group">
            <label for="weight">Вазни бор (кг)</label>
            <input type="number" id="weight" step="0.1" placeholder="2.5">
        </div>

        <div class="form-group">
            <label for="category">Намуди бор / Тариф</label>
            <select id="category">
                <option value="standard">Бори оддӣ ($3.5 / кг)</option>
                <option value="express">Бори тезсохт / Экспресс ($4.5 / кг)</option>
                <option value="heavy">Бори вазнин (аз 10кг боло - $3.0 / кг)</option>
            </select>
        </div>

        <button class="btn" onclick="saveParcel()">Ҳамроҳ ва сабт кардан</button>

        <!-- Рӯйхати борҳои сабтшуда -->
        <div class="parcels-header">
            <span>📦 Борҳои сабтшуда</span>
        </div>

        <div id="parcelsList">
            <!-- Борҳо тавассути JS дар ин ҷо пайдо мешаванд -->
        </div>
    </div>

</div>

<script>
    let tempUser = { fullName: '', phone: '', generatedCode: '' };

    // Ҳангоми кушодани саҳифа, сабтҳоро аз localStorage мехонем
    window.onload = function() {
        const savedUser = JSON.parse(localStorage.getItem('payghom_user'));
        if (savedUser && savedUser.isLoggedIn) {
            showAppView(savedUser.fullName);
        }
    };

    function sendSMSCode() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phoneNumber').value.trim();

        if (!fullName || phone.length < 8) {
            alert('Лутфан ном, насаб ва рақами телефонро дуруст ворид кунед!');
            return;
        }

        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
        tempUser = { fullName, phone, generatedCode: randomCode };

        alert(`[SMS-Симулятсия]\nКоди тасдиқи шумо: ${randomCode}`);

        document.getElementById('smsSentText').innerText = `Код ба рақами ${phone} фиристода шуд.`;
        switchStep('step-sms');
    }

    function verifySMSCode() {
        const enteredCode = document.getElementById('smsCode').value.trim();

        if (enteredCode === tempUser.generatedCode) {
            const userData = { fullName: tempUser.fullName, phone: tempUser.phone, isLoggedIn: true };
            localStorage.setItem('payghom_user', JSON.stringify(userData));
            showAppView(userData.fullName);
        } else {
            alert('Коди SMS нодуруст аст!');
        }
    }

    function backToRegister() {
        switchStep('step-register');
    }

    function showAppView(name) {
        document.getElementById('userDisplayName').innerText = name;
        switchStep('step-app');
        renderParcels(); // Борҳои пештара сабтшударо нишон медиҳад
    }

    function logout() {
        localStorage.removeItem('payghom_user');
        switchStep('step-register');
    }

    function switchStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    // --- САБТИ БОРҲО ДАР LOCALSTORAGE --- //

    function saveParcel() {
        const trackCode = document.getElementById('trackCode').value.trim();
        const weightInput = parseFloat(document.getElementById('weight').value);
        const category = document.getElementById('category').value;

        if (!trackCode || isNaN(weightInput) || weightInput <= 0) {
            alert('Лутфан трек-код ва вазни дурустро ворид кунед!');
            return;
        }

        // Ҳисоби нарх
        let rate = 3.5;
        if (category === 'express') rate = 4.5;
        else if (category === 'heavy' || weightInput >= 10) rate = 3.0;

        const totalPrice = (weightInput * rate).toFixed(2);

        // Сохтани объекти бор
        const newParcel = {
            id: Date.now(),
            trackCode: trackCode,
            weight: weightInput,
            rate: rate,
            totalPrice: totalPrice
        };

        // Гирифтани борҳои кӯҳна ва иловаи бори нав
        let parcels = JSON.parse(localStorage.getItem('payghom_parcels')) || [];
        parcels.push(newParcel);

        // Сабти навшуда ба localStorage
        localStorage.setItem('payghom_parcels', JSON.stringify(parcels));

        // Тоза кардани майдонҳо ва афзоиши рӯйхат
        document.getElementById('trackCode').value = '';
        document.getElementById('weight').value = '';

        alert('Бори шумо муваффақона сабт шуд!');
        renderParcels();
    }

    // Намоиши рӯйхати борҳо
    function renderParcels() {
        const parcelsList = document.getElementById('parcelsList');
        const parcels = JSON.parse(localStorage.getItem('payghom_parcels')) || [];

        if (parcels.length === 0) {
            parcelsList.innerHTML = `<div class="empty-state">Ҳоло ҳеҷ боре сабт нашудааст.</div>`;
            return;
        }

        let html = '';
        parcels.forEach(p => {
            html += `
                <div class="parcel-item">
                    <button class="delete-btn" onclick="deleteParcel(${p.id})">Удалить</button>
                    <div class="parcel-info">Трек: <strong>${p.trackCode}</strong></div>
                    <div class="parcel-info">Вазн: <strong>${p.weight} кг</strong> ($${p.rate}/кг)</div>
                    <div class="parcel-price">Сумма: $${p.totalPrice}</div>
                </div>
            `;
        });

        parcelsList.innerHTML = html;
    }

    // Ҳазф кардани як бор
    function deleteParcel(id) {
        let parcels = JSON.parse(localStorage.getItem('payghom_parcels')) || [];
        parcels = parcels.filter(p => p.id !== id);
        localStorage.setItem('payghom_parcels', JSON.stringify(parcels));
        renderParcels();
    }
</script>

</body>
</html>
